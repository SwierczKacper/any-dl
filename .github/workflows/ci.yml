name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # ffmpeg is not on the runner by default, and without it the download
      # integration tests would skip themselves.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # Only the optional ffmpeg-static; this also checks the lockfile is valid.
      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: for file in bin/*.js src/*.js; do node --check "$file"; done

      # Unit tests plus pty-backed prompt tests; all offline, no Kick access.
      - name: Tests
        run: npm test

      - name: CLI smoke test
        run: |
          node bin/any-dl.js --version
          node bin/any-dl.js --help > /dev/null
